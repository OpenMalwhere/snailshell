# Optional: builds Snailshell for Windows, Linux and macOS on GitHub (Actions tab -> Run workflow)
name: build
on: workflow_dispatch
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: snailshell-${{ matrix.os }}
          path: dist
